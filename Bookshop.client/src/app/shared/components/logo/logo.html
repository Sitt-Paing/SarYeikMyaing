<a [routerLink]="linkUrl()" class="inline-flex items-center gap-3 group select-none text-decoration-none">
  <div [class]="iconSizeClass()" class="relative shrink-0 flex items-center justify-center transition-transform duration-300 group-hover:scale-105">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-sm">
      <polygon points="90,40 125,58 125,160 90,160" fill="#0B0F19" />
      <polygon points="125,148 190,150 190,160 125,160" fill="#0B0F19" />
      <polygon points="15,160 190,160 125,150 15,150" fill="#111827" opacity="0.4" />

      <polygon points="15,45 23,40 38,40 38,158 15,158" fill="#00A3FF" />
      <polygon points="23,40 38,40 38,158 30,158" fill="#0284C7" />
      <polygon points="15,45 23,40 30,45 15,45" fill="#38BDF8" />

      <polygon points="40,43 48,39 63,39 63,158 40,158" fill="#00A3FF" />
      <polygon points="48,39 63,39 63,158 55,158" fill="#0284C7" />
      <polygon points="40,43 48,39 55,43 40,43" fill="#38BDF8" />

      <polygon points="65,42 73,38 88,38 88,158 65,158" fill="#00A3FF" />
      <polygon points="73,38 88,38 88,158 80,158" fill="#0284C7" />
      <polygon points="65,42 73,38 80,42 65,42" fill="#38BDF8" />

      <polygon points="90,40 90,158 125,158 125,58" fill="#00A3FF" />
      <polygon points="90,40 100,35 125,58 115,58" fill="#38BDF8" />
    </svg>
  </div>

  @if (showText()) {
    <div class="flex flex-col">
      <div class="flex items-center gap-1.5">
        <span class="font-extrabold tracking-tight text-slate-900 leading-none" [class]="titleSizeClass()">
          စာအုပ်စင်
        </span>
        <span class="text-xs uppercase font-bold px-1.5 py-0.5 rounded bg-brand-500 text-white tracking-wider">
          Shop
        </span>
      </div>
      <span class="text-[11px] font-medium tracking-wide text-brand-600 font-sans mt-0.5">
        SAR OAT SIN BOOKS
      </span>
    </div>
  }
</a>
