<div class="space-y-6">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200">
    <div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900">
        Categories Management (ကဏ္ဍများ စီမံခန့်ခွဲမှု)
      </h1>
      <p class="text-xs sm:text-sm text-slate-500 mt-1">
        Organize catalog classifications and book genres in the database
      </p>
    </div>

    <div class="flex items-center gap-2">
      <button
        (click)="seedStandardCategories()"
        class="px-3.5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs transition-colors flex items-center gap-1.5"
        title="Add standard Myanmar categories to DB"
      >
        <i class="pi pi-download"></i> Seed Default Categories
      </button>

      <button
        (click)="openNewCategoryDialog()"
        class="px-4 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-bold text-xs shadow-brand-glow transition-all flex items-center gap-2"
      >
        <i class="pi pi-plus"></i> ကဏ္ဍအသစ် ထည့်သွင်းမည် (Add Category)
      </button>
    </div>
  </div>

  <!-- PrimeNG Data Table -->
  <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden p-4 sm:p-6">
    <p-table
      [value]="categoryService.categories()"
      [loading]="categoryService.isLoading()"
      [paginator]="true"
      [rows]="10"
      responsiveLayout="stack"
      styleClass="p-datatable-sm"
    >
      <ng-template pTemplate="header">
        <tr class="text-xs text-slate-500 uppercase">
          <th style="width: 70px">Icon</th>
          <th>Category Name</th>
          <th>Description</th>
          <th style="width: 110px">Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-cat>
        <tr class="hover:bg-slate-50/70 text-xs transition-colors">
          <td>
            <div class="w-8 h-8 rounded-lg bg-brand-50 text-brand-600 flex items-center justify-center text-sm shadow-sm">
              <i [class]="'pi ' + (cat.icon || 'pi-tag')"></i>
            </div>
          </td>
          <td>
            <span class="font-bold text-slate-900">{{ cat.name }}</span>
          </td>
          <td>
            <span class="text-slate-500 text-xs">{{ cat.description || '-' }}</span>
          </td>
          <td>
            <div class="flex items-center gap-1">
              <button
                (click)="editCategory(cat)"
                class="p-1.5 rounded-lg text-brand-600 hover:bg-brand-50 transition-colors"
                title="Edit Category"
              >
                <i class="pi pi-pencil text-xs"></i>
              </button>
              <button
                (click)="deleteCategory(cat)"
                class="p-1.5 rounded-lg text-rose-600 hover:bg-rose-50 transition-colors"
                title="Delete Category"
              >
                <i class="pi pi-trash text-xs"></i>
              </button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="text-center p-8 text-slate-400 text-xs">
            No categories found in the database. Click "Add Category" to create one.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <!-- Add / Edit Dialog -->
  <p-dialog
    [(visible)]="isDialogVisible"
    [header]="isEditMode ? 'Edit Category' : 'Add New Category'"
    [modal]="true"
    [style]="{ width: '90vw', maxWidth: '500px' }"
  >
    <div class="space-y-4 py-2 text-xs">
      <div class="space-y-1">
        <label class="font-bold text-slate-700">Category Name (ကဏ္ဍအမည်) *</label>
        <input
          type="text"
          [(ngModel)]="currentCategory.name"
          class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs outline-none focus:border-brand-500"
          placeholder="e.g. Myanmar Literature"
        />
      </div>

      <div class="space-y-1">
        <label class="font-bold text-slate-700">Description</label>
        <textarea
          [(ngModel)]="currentCategory.description"
          rows="3"
          class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs outline-none focus:border-brand-500"
          placeholder="Category overview..."
        ></textarea>
      </div>
    </div>

    <ng-template pTemplate="footer">
      <div class="flex justify-end gap-2 pt-2">
        <button
          (click)="isDialogVisible = false"
          class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold hover:bg-slate-50"
        >
          Cancel
        </button>
        <button
          (click)="saveCategory()"
          [disabled]="isSaving"
          class="px-5 py-2 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-brand-glow disabled:bg-slate-300"
        >
          @if (isSaving) {
            <i class="pi pi-spin pi-spinner mr-1"></i> Saving...
          } @else {
            Save Category
          }
        </button>
      </div>
    </ng-template>
  </p-dialog>
</div>
